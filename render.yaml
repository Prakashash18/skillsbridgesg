# Render blueprint for the SkillBridge SG FastAPI backend.
# In the Render dashboard: New + → Blueprint → point at this repo.
# The build step ingests the 3 SkillsFuture workbooks into SQLite (~2,027 roles)
# so the deployed API serves the real catalogue, not the 5-role demo seed.
services:
  - type: web
    name: skillbridge-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: "pip install -r requirements.txt && python -m scripts.ingest_datasets"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      # Comma-separated frontend origins allowed by CORS. Set to your Vercel URL
      # after the frontend deploys, e.g. https://skillbridge-sg.vercel.app
      - key: ALLOWED_ORIGINS
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4.1
      - key: APIFY_TOKEN
        sync: false
      - key: APIFY_ACTOR_ID
        value: orgupdate/google-jobs-scraper
